$kind: http-request
name: Eliminar producto con ventas -> 409
url: "{{baseUrl}}/productos/{{productoId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 9000
