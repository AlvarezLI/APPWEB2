$kind: http-request
url: "{{baseUrl}}/ventas/buscar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pagado": true
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
