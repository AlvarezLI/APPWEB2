$kind: http-request
url: "{{baseUrl}}/ventas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "direccion": "Av. Siempre Viva 742",
      "productos": [
        {
          "producto": "{{productoId}}",
          "cantidad": 2
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Total calculado en el servidor', () => pm.expect(pm.response.json().total).to.eql(3600));
      pm.collectionVariables.set('ventaId', pm.response.json()._id);
    language: text/javascript
order: 1000
