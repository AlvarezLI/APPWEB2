$kind: http-request
url: "{{baseUrl}}/ventas/{{ventaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "direccion": "Calle Nueva 123"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Dirección actualizada', () => pm.expect(pm.response.json().direccion).to.eql('Calle Nueva 123'));
    language: text/javascript
order: 7000
