$kind: http-request
name: Historial de OTRO usuario -> 403
url: "{{baseUrl}}/ventas/usuario/000000000000000000000001"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 8000
