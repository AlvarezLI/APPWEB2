$kind: http-request
name: Actualizar OTRO usuario con token válido -> 403
url: "{{baseUrl}}/usuarios/000000000000000000000001"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "X"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
