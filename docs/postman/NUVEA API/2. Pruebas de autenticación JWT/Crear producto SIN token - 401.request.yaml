$kind: http-request
name: Crear producto SIN token -> 401
url: "{{baseUrl}}/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "x",
      "precio": 1,
      "categoria": "hogar"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 5000
