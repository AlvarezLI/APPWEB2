$kind: http-request
name: Actualizar usuario con token inválido -> 401
url: "{{baseUrl}}/usuarios/{{usuarioId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "X"
    }
auth:
  type: bearer
  credentials:
    token: token.invalido.123
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
