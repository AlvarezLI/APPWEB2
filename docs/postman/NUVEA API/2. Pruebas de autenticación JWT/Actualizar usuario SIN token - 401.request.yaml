$kind: http-request
name: Actualizar usuario SIN token -> 401
url: "{{baseUrl}}/usuarios/{{usuarioId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "X"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
