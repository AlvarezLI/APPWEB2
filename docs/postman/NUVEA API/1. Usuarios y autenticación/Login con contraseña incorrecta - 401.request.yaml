$kind: http-request
name: Login con contraseña incorrecta -> 401
url: "{{baseUrl}}/usuarios/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "contraseña": "incorrecta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
