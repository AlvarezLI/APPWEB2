$kind: http-request
name: Registro con contraseña corta -> 400
url: "{{baseUrl}}/usuarios/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "A",
      "apellido": "B",
      "email": "corta@example.com",
      "contraseña": "123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
