$kind: http-request
name: Registro duplicado -> 409
url: "{{baseUrl}}/usuarios/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Postman",
      "apellido": "Test",
      "email": "{{email}}",
      "contraseña": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
