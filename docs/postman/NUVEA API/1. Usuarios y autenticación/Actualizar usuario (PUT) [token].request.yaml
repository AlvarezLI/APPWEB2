$kind: http-request
url: "{{baseUrl}}/usuarios/{{usuarioId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Postman Editado"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Nombre actualizado', () => pm.expect(pm.response.json().nombre).to.eql('Postman Editado'));
    language: text/javascript
order: 8000
